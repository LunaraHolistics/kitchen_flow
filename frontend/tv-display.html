<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Flow TV v1.1 - Painel de Pedidos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --highlight: rgba(34, 197, 94, 0.3);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--card-bg);
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 2rem; letter-spacing: 1px; }
    .status { font-size: 1.2rem; font-weight: bold; }
    .status.online { color: var(--success); }
    .status.offline { color: var(--danger); }
    .status.loading { color: var(--warn); }
    .clock { font-size: 2.5rem; font-weight: bold; font-variant-numeric: tabular-nums; }
    .last-update { 
      font-size: 0.9rem; 
      color: var(--muted); 
      margin-top: 4px;
    }

    /* Board Layout */
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      flex: 1;
      overflow: hidden;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .column-header {
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .col-prep .column-header { background: var(--warn); color: #000; }
    .col-ready .column-header { background: var(--success); color: #000; }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px 20px;
      border-left: 8px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      animation: slideIn 0.4s ease-out;
    }

    .card.ready {
      border-left-color: var(--success);
      background: var(--highlight);
      animation: flash 1s infinite alternate;
    }

    .card-info h2 {
      margin: 0 0 5px 0;
      font-size: 2.2rem;
      color: var(--accent);
    }

    .card.ready h2 { color: var(--success); }

    .card-items {
      font-size: 1.4rem;
      color: var(--muted);
      margin: 0;
      list-style: none;
      padding: 0;
    }

    .card-items li { margin-bottom: 4px; }
    .qty { font-weight: bold; color: var(--text); }

    .card-meta {
      text-align: right;
      min-width: 120px;
    }

    .timer {
      font-size: 2rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 5px;
    }

    .badge.kids { background: #a855f7; color: white; }

    /* Empty State */
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 1.2rem;
      font-style: italic;
    }

    /* Animations */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flash {
      from { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); transform: scale(1); }
      to { box-shadow: 0 0 20px 10px rgba(34, 197, 94, 0.8); transform: scale(1.02); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--card-bg); border-radius: 4px; }

    /* Config Modal */
    #config-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    #config-modal.visible { display: flex; }
    .config-box {
      background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center;
      max-width: 500px; width: 90%;
    }
    .config-box h2 { margin-top: 0; color: var(--accent); }
    input {
      font-size: 1.5rem; padding: 10px; width: 300px; text-align: center;
      background: var(--bg); color: white; border: 1px solid var(--accent); border-radius: 8px;
      font-family: 'Courier New', monospace;
    }
    input:focus { outline: none; border-color: var(--success); }
    button {
      font-size: 1.5rem; padding: 10px 30px; margin-top: 15px;
      background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: var(--success); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .config-error {
      color: var(--danger);
      margin-top: 10px;
      font-size: 0.9rem;
      min-height: 20px;
    }
    .config-help {
      margin-top: 15px; 
      font-size: 0.85rem; 
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Configuração Inicial -->
  <div id="config-modal">
    <div class="config-box">
      <h2>📺 Configurar TV Display</h2>
      <p>Digite o IP do PC do Caixa:</p>
      <input type="text" id="ip-input" placeholder="192.168.0.100" autocomplete="off">
      <br>
      <button id="connect-btn" onclick="saveConfig()">Conectar</button>
      <div id="config-error" class="config-error"></div>
      <div class="config-help">
        💡 <strong>Dica:</strong> Para pular esta tela, acesse diretamente:<br>
        <code style="background:#0f172a; padding:2px 6px; border-radius:4px;">?ip=192.168.0.190</code>
      </div>
    </div>
  </div>

  <header>
    <div>
      <h1>🍳 KITCHEN FLOW TV</h1>
      <span id="status-text" class="status offline">🔴 Desconectado</span>
      <div id="last-update" class="last-update">Aguardando conexão...</div>
    </div>
    <div id="clock" class="clock">00:00</div>
  </header>

  <div class="board">
    <!-- Coluna Em Produção -->
    <div class="column col-prep">
      <div class="column-header">🔥 Em Produção</div>
      <div id="prep-list">
        <div class="empty-state">Nenhum pedido em produção</div>
      </div>
    </div>

    <!-- Coluna Prontos -->
    <div class="column col-ready">
      <div class="column-header">✅ Prontos para Retirada</div>
      <div id="ready-list">
        <div class="empty-state">Nenhum pedido pronto</div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================================
    // ESTADO GLOBAL
    // ============================================================================
    let API_BASE = '';
    let orders = [];
    let pollInterval = null;
    let fetchFailCount = 0;
    const MAX_FETCH_FAILS = 3;
    let audioContext = null; // ← NOVO: Contexto compartilhado

    // ============================================================================
    // INICIALIZAÇÃO ROBUSTA
    // ============================================================================
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlIp = urlParams.get('ip');
      const savedIp = localStorage.getItem('tv_display_ip');
      
      // Prioridade: URL > localStorage > Modal
      if (urlIp) {
        console.log('🔌 IP via URL:', urlIp);
        setApiBase(urlIp);
      } else if (savedIp) {
        console.log('🔌 IP do localStorage:', savedIp);
        setApiBase(savedIp);
      } else {
        console.log('🔌 Mostrando modal de configuração');
        document.getElementById('config-modal').classList.add('visible');
        document.getElementById('ip-input').focus();
      }

      updateClock();
      setInterval(updateClock, 1000);
      
      // ← NOVO: Enter para submeter no modal
      document.getElementById('ip-input')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') saveConfig();
      });
    };

    // ============================================================================
    // CONFIGURAÇÃO DE IP (CORRIGIDA)
    // ============================================================================
    function saveConfig() {
      const input = document.getElementById('ip-input');
      const errorEl = document.getElementById('config-error');
      const btn = document.getElementById('connect-btn');
      const ip = input.value.trim();
      
      // Validação
      if (!ip) {
        errorEl.textContent = '❌ Digite um IP válido';
        input.focus();
        return;
      }
      
      // Regex básico para IPv4
      const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
      if (!ipRegex.test(ip)) {
        errorEl.textContent = '❌ Formato inválido. Use: 192.168.0.100';
        input.focus();
        return;
      }
      
      // Feedback visual
      btn.disabled = true;
      btn.textContent = 'Conectando...';
      errorEl.textContent = '';
      
      // ← NOVO: Salvar ANTES de tentar conectar (persistência garantida)
      localStorage.setItem('tv_display_ip', ip);
      console.log('✅ IP salvo no localStorage:', ip);
      
      // Atualizar URL para facilitar favoritos
      const newUrl = `${window.location.pathname}?ip=${ip}`;
      window.history.replaceState({}, '', newUrl);
      
      // Iniciar conexão
      setApiBase(ip);
    }

    function setApiBase(ip) {
      API_BASE = `http://${ip}:4545`;
      document.getElementById('config-modal').classList.remove('visible');
      
      // ← NOVO: Salvar no localStorage (garantia dupla)
      localStorage.setItem('tv_display_ip', ip);
      
      connect();
    }

    // ============================================================================
    // CLOCK E UI
    // ============================================================================
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = 
        now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
    }

    function updateLastUpdate() {
      const now = new Date();
      document.getElementById('last-update').textContent = 
        `🔄 Última atualização: ${now.toLocaleTimeString('pt-BR')}`;
    }

    // ============================================================================
    // CONEXÃO E POLLING (CORRIGIDO)
    // ============================================================================
    function connect() {
      const statusText = document.getElementById('status-text');
      statusText.textContent = '🟡 Conectando...';
      statusText.className = 'status loading';
      
      // Limpar polling anterior
      if (pollInterval) clearInterval(pollInterval);
      
      // Busca inicial
      fetchOrders();
      
      // Polling a cada 5 segundos
      pollInterval = setInterval(fetchOrders, 5000);
    }

    async function fetchOrders() {
      try {
        // ← NOVO: Cache busting para evitar dados antigos
        const url = `${API_BASE}/api/waiter/orders?_=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        
        const res = await fetch(url, { 
          signal: controller.signal,
          cache: 'no-cache'
        });
        
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        const newOrders = data.orders || [];
        
        // Detectar novos pedidos prontos para alerta
        checkAlerts(orders, newOrders);
        orders = newOrders;
        render(orders);
        
        // ← NOVO: Sucesso - reseta contador e marca online
        if (fetchFailCount > 0) {
          console.log('✅ Conexão restaurada');
        }
        fetchFailCount = 0;
        
        const statusText = document.getElementById('status-text');
        statusText.textContent = '🟢 Conectado';
        statusText.className = 'status online';
        updateLastUpdate();
        
      } catch (e) {
        fetchFailCount++;
        console.warn(`⚠️ Falha ${fetchFailCount}/${MAX_FETCH_FAILS}:`, e.message);
        
        // ← NOVO: Só marca offline após 3 falhas consecutivas
        if (fetchFailCount >= MAX_FETCH_FAILS) {
          const statusText = document.getElementById('status-text');
          statusText.textContent = '🔴 Sem conexão';
          statusText.className = 'status offline';
        }
      }
    }

    // ============================================================================
    // SISTEMA DE ALERTAS (CORRIGIDO E ROBUSTO)
    // ============================================================================
    function checkAlerts(oldOrders, newOrders) {
      newOrders.forEach(newOrder => {
        if (newOrder.status === 'concluido') {
          const oldOrder = oldOrders.find(o => o.id === newOrder.id);
          // Só alerta se é um pedido NOVO na lista de prontos
          if (!oldOrder || oldOrder.status !== 'concluido') {
            triggerAlert(newOrder.mesa);
          }
        }
      });
    }

    function triggerAlert(mesa) {
      console.log(`🔔 Alerta: Mesa ${mesa} pronta!`);
      
      // ← NOVO: Som discreto com contexto compartilhado (mais estável)
      try {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioContext = new AudioCtx();
        }
        
        if (audioContext) {
          // Resume se estiver suspenso (política de autoplay)
          if (audioContext.state === 'suspended') {
            audioContext.resume();
          }
          
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.connect(gain);
          gain.connect(audioContext.destination);
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioContext.currentTime); // Lá
          osc.frequency.exponentialRampToValueAtTime(440, audioContext.currentTime + 0.3);
          gain.gain.setValueAtTime(0.15, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
          
          osc.start();
          osc.stop(audioContext.currentTime + 0.5);
        }
      } catch(e) {
        console.warn('⚠️ Som não reproduzido:', e.message);
      }

      // Scroll para o topo da lista de prontos
      const readyList = document.getElementById('ready-list');
      if (readyList) readyList.scrollTop = 0;
    }

    // ← NOVO: Inicializar AudioContext no primeiro clique (política autoplay)
    document.addEventListener('click', () => {
      if (!audioContext) {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            audioContext = new AudioCtx();
            audioContext.resume();
          }
        } catch(e) {}
      }
    }, { once: true });

    // ============================================================================
    // RENDERIZAÇÃO
    // ============================================================================
    function render(ordersList) {
      const prepList = document.getElementById('prep-list');
      const readyList = document.getElementById('ready-list');
      
      prepList.innerHTML = '';
      readyList.innerHTML = '';

      // Filtrar e ordenar (mais recentes primeiro)
      const prep = ordersList
        .filter(o => o.status !== 'concluido' && o.status !== 'cancelled')
        .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      const ready = ordersList
        .filter(o => o.status === 'concluido')
        .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

      // Renderizar ou mostrar empty state
      if (prep.length === 0) {
        prepList.innerHTML = '<div class="empty-state">Nenhum pedido em produção</div>';
      } else {
        prep.forEach(order => prepList.appendChild(createCard(order, false)));
      }
      
      if (ready.length === 0) {
        readyList.innerHTML = '<div class="empty-state">Nenhum pedido pronto</div>';
      } else {
        ready.forEach(order => readyList.appendChild(createCard(order, true)));
      }
    }

    function createCard(order, isReady) {
      const div = document.createElement('div');
      div.className = `card ${isReady ? 'ready' : ''}`;
      
      // ← NOVO: Proteção contra itens undefined
      const itens = order.itens || [];
      const itemsHtml = itens.length > 0 
        ? itens.map(i => 
            `<li><span class="qty">${i.quantidade || 1}x</span> ${i.item || 'Item'}</li>`
          ).join('')
        : '<li><em>Sem itens</em></li>';

      const priorityBadge = order.hasPriority 
        ? '<span class="badge kids">👶 PRIORIDADE</span>' 
        : '';

      div.innerHTML = `
        <div class="card-info">
          <h2>${order.mesa || 'Mesa ?'} ${priorityBadge}</h2>
          <ul class="card-items">${itemsHtml}</ul>
        </div>
        <div class="card-meta">
          <div class="timer">${formatTime(order.elapsedMinutes)}</div>
        </div>
      `;
      return div;
    }

    function formatTime(minutes) {
      if (!minutes && minutes !== 0) return '0min';
      if (minutes < 1) return '< 1min';
      if (minutes < 60) return `${minutes}min`;
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${h}h ${m}min`;
    }

    // ============================================================================
    // CLEANUP AO FECHAR
    // ============================================================================
    window.addEventListener('beforeunload', () => {
      if (pollInterval) clearInterval(pollInterval);
      if (audioContext) {
        try { audioContext.close(); } catch(e) {}
      }
    });
  </script>
</body>
</html>
